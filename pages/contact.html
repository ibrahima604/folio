<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Contact - Portfolio Ibrahima Diallo</title>
<!-- Bootstrap CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<style>
body {
    background: linear-gradient(to right, #f4f4f9, #e0e7ff);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #0b3c5d;
}

/* Contact Section */
.contact-section {
    padding: 4rem 0;
}
.contact-section h1 {
    margin-bottom: 2rem;
    color: #0b3c5d;
    font-weight: 700;
    text-align: center;
}
.contact-info {
    margin-bottom: 2rem;
}
.contact-info i {
    color: #f18f01;
    margin-right: 8px;
}
.contact-info a {
    text-decoration: none;
    color: #0b3c5d;
    font-weight: 500;
}
.contact-info a:hover {
    color: #f18f01;
}
.contact-info p {
    margin: 0.5rem 0;
}

/* Formulaire */
.card-contact {
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    padding: 2rem;
    background-color: #fff;
}
.form-control:focus {
    border-color: #f18f01;
    box-shadow: 0 0 0 0.2rem rgba(241,143,1,0.25);
}
.btn-submit {
    background-color: #0b3c5d;
    color: #fff;
    font-weight: bold;
    transition: all 0.3s ease;
}
.btn-submit:hover {
    background-color: #f18f01;
    color: #fff;
    transform: scale(1.05);
}
@media (max-width: 768px){
    .contact-info {
        text-align: center;
    }
}
</style>
</head>
<body>

<div class="container contact-section">
    <h1>Contactez-moi</h1>

    <!-- Contact Info -->
    <div class="row text-center contact-info">
        <div class="col-md-4 mb-3">
            <i class="bi bi-envelope-fill"></i>
            <a href="mailto:ibd8905@gmail.com">ibd8905@gmail.com</a>
        </div>
        <div class="col-md-4 mb-3">
            <i class="bi bi-person-badge-fill"></i>
            <p>Ibrahima Diallo</p>
        </div>
        <div class="col-md-4 mb-3">
            <i class="bi bi-geo-alt-fill"></i>
            <p>Paris, France</p>
        </div>
    </div>

    <!-- Formulaire -->
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-contact">
                <form id="contactForm">
                    <div class="mb-3">
                        <label for="name" class="form-label"><i class="bi bi-person-fill"></i> Nom</label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="Votre nom complet">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label"><i class="bi bi-envelope-fill"></i> Email</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="Votre adresse email">
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label"><i class="bi bi-card-text"></i> Objet</label>
                        <input type="text" class="form-control" id="subject" name="subject" required placeholder="Sujet de votre message">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label"><i class="bi bi-chat-left-text-fill"></i> Message</label>
                        <textarea class="form-control" id="message" name="message" rows="6" required placeholder="Écrivez votre message ici"></textarea>
                    </div>
                    <button type="submit" class="btn btn-submit w-100"><i class="bi bi-send-fill"></i> Envoyer le message</button>
                    <p id="formMessage" class="text-success mt-3 text-center"></p>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
$('#contactForm').submit(function(e){
    e.preventDefault();

    const name = $('#name').val().trim();
    const email = $('#email').val().trim();
    const subject = $('#subject').val().trim();
    const message = $('#message').val().trim();

    if(name === "" || email === "" || subject === "" || message === ""){
        $('#formMessage').text("Veuillez remplir tous les champs.").removeClass("text-success").addClass("text-danger");
        return;
    }

    $('#formMessage').text("Votre message a été envoyé !").removeClass("text-danger").addClass("text-success");

    $(this)[0].reset();
});
</script>
</body>
</html>

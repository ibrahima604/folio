<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio Ibrahima Diallo</title>
<!-- Bootstrap CSS & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<style>
/* Navbar fixe et stylée */
.navbar {
    background-color: #0b3c5d;
}
.navbar .btn-nav {
    color: #fff;
    font-weight: bold;
    margin: 0 5px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.3s ease;
}
.navbar .btn-nav:hover {
    color: #0b3c5d;
    background-color: #f18f01;
}
.hero {
    padding-top: 5rem; /* espace pour navbar fixe */
}
#content {
    margin-top: 2rem;
}

/* Mobile styling */
@media (max-width: 991px) {
    .navbar .d-flex {
        flex-direction: column;
        width: 100%;
    }
    .navbar .btn-nav {
        width: 100%;
        justify-content: center;
        margin: 3px 0;
    }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <!-- Logo / Home -->
    <button class="btn btn-dark btn-lg me-3" id="homeBtn"><i class="bi bi-house-door-fill"></i> Ibrahima Diallo</button>

    <!-- Burger -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Boutons de navigation -->
    <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
      <div class="d-flex">
        <button class="btn btn-nav nav-btn" data-page="home"><i class="bi bi-house"></i> Accueil</button>
        <button class="btn btn-nav nav-btn" data-page="about"><i class="bi bi-person"></i> À propos</button>
        <button class="btn btn-nav nav-btn" data-page="skills"><i class="bi bi-tools"></i> Compétences</button>
        <button class="btn btn-nav nav-btn" data-page="projects"><i class="bi bi-kanban"></i> Projets</button>
        <button class="btn btn-nav nav-btn" data-page="education"><i class="bi bi-book"></i> Éducation</button>
        <button class="btn btn-nav nav-btn" data-page="contact"><i class="bi bi-envelope"></i> Contact</button>
      </div>
    </div>
  </div>
</nav>

<!-- Contenu principal AJAX -->
<div id="content" class="container hero text-center">
    <h1 class="display-4">Bienvenue sur mon portfolio</h1>
    <p>Cliquez sur les boutons de navigation pour découvrir mon travail.</p>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function(){

    // Gestion des boutons AJAX
    $(".nav-btn").click(function(){
        var page = $(this).data("page");

        if(page === "home"){
            // Recharger le contenu de index.html
            $("#content").fadeOut(200, function(){
                $("#content").load("index.html #content > *", function(){
                    $(this).fadeIn(300);
                });
            });
        } else {
            // Charger pages/*.html
            $("#content").fadeOut(200, function(){
                $("#content").load("pages/" + page + ".html", function(){
                    $(this).fadeIn(300);
                });
            });
        }
    });

    // Bouton home / logo
    $("#homeBtn").click(function(){
        $("#content").fadeOut(200, function(){
            $("#content").load("index.html #content > *", function(){
                $(this).fadeIn(300);
            });
        });
    });

});
</script>
</body>
</html>
